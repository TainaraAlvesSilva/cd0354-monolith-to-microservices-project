name: CI/CD - Build and Push Docker Images

on:
  push:
    branches: [ main, resubmission-microservices ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push udagram-api-feed
        uses: docker/build-push-action@v5
        with:
          context: ./udagram-api-feed
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/udagram-api-feed:v1

      - name: Build and push udagram-api-user
        uses: docker/build-push-action@v5
        with:
          context: ./udagram-api-user
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/udagram-api-user:v1

      - name: Build and push udagram-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./udagram-frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/udagram-frontend:v1

      - name: Build and push reverseproxy
        uses: docker/build-push-action@v5
        with:
          context: ./udagram-reverseproxy
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/reverseproxy:v1